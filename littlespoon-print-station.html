<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Spoon · Print Station</title>
<style>
  :root {
    --bg: #1E1712;
    --card: #2A211A;
    --border: #4A3B2E;
    --text: #FAF6F0;
    --muted: #A89880;
    --terracotta: #E8845E;
    --sage: #9BB89B;
    --gold: #D4A94F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type="date"], input[type="url"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    margin-bottom: 12px;
  }
  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--terracotta); color: #fff; }
  .btn-secondary { background: var(--border); color: var(--text); margin-left: 8px; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 18px; }
  #status.error { color: #E88; }
  #status.ok { color: var(--sage); }

  /* Preview daftar tag di layar */
  .tag-preview {
    background: #FAF6F0;
    color: #1E1712;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
  }
  .tag-preview .tp-customer { font-weight: bold; font-size: 14px; }
  .tag-preview .tp-meta { font-size: 10px; color: #6B5B49; margin-bottom: 6px; }
  .tag-preview .tp-item { display: flex; justify-content: space-between; }
  .tag-preview .tp-total { font-weight: bold; text-align: right; border-top: 1px dashed #999; margin-top: 4px; padding-top: 4px; }
  .count-badge {
    display: inline-block;
    background: var(--sage);
    color: #1E1712;
    font-size: 12px;
    font-weight: 700;
    border-radius: 10px;
    padding: 2px 10px;
    margin-left: 8px;
  }

  /* ── PRINT (thermal 80mm, panjang auto per order) ──
     Lebar fix 80mm — kalau printer diset 58mm, driver printer yang
     menskalakan. Panjang halaman TIDAK fix: @page auto + tinggi tag
     mengikuti isi, page-break per tag supaya printer auto-cut rapi
     di akhir tiap order. ── */
  #printArea { display: none; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
    body { background: #fff; padding: 0; }
    @page { size: 80mm auto; margin: 0; }
    .print-tag {
      width: 72mm;
      padding: 2mm 1mm 4mm 1mm;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #000;
      page-break-after: always;
      page-break-inside: avoid;
    }
    .print-tag:last-child { page-break-after: auto; }
    .print-tag .pt-header {
      text-align: center;
      border-bottom: 1px dashed #000; padding-bottom: 2mm; margin-bottom: 2mm;
    }
    .print-tag .pt-header img { display: block; margin: 0 auto; width: 60%; max-width: 45mm; height: auto; }
    .print-tag .pt-customer { font-size: 14px; font-weight: bold; margin-bottom: 1mm; word-wrap: break-word; }
    .print-tag .pt-meta { font-size: 10px; margin-bottom: 2mm; }
    .print-tag .pt-items {
      border-top: 1px dashed #000; border-bottom: 1px dashed #000;
      padding: 1.5mm 0; margin-bottom: 1.5mm;
    }
    .print-tag .pt-item { display: flex; justify-content: space-between; }
    .print-tag .pt-total { font-weight: bold; text-align: right; }
    .print-tag .pt-footer {
      font-size: 9px; text-align: left; margin-top: 2mm;
      border-top: 1px dashed #000; padding-top: 1.5mm;
    }
    .print-tag .pt-note { font-size: 9px; text-align: left; margin-top: 1mm; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🖨 Little Spoon · Print Station</h1>
  <p class="subtitle">Tarik semua order dari semua kasir per tanggal, cetak tag sekali proses.</p>

  <div class="card">
    <label for="scriptUrl">URL Apps Script (sama dengan yang dipakai POS)</label>
    <input type="url" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec">

    <label for="tanggal">Tanggal pesanan (PO)</label>
    <input type="date" id="tanggal">

    <button class="btn-primary" id="btnLoad" onclick="loadOrders()">📥 Tarik Data Order</button>
    <button class="btn-secondary" id="btnPrint" onclick="printAll()" disabled>🖨 Cetak Semua</button>
    <div id="status"></div>
  </div>

  <div class="card" id="previewCard" style="display:none;">
    <div style="margin-bottom:12px;font-weight:600;">
      Preview Tag <span class="count-badge" id="countBadge">0</span>
    </div>
    <div id="previewList"></div>
  </div>
</div>

<div id="printArea"></div>

<script>
let loadedOrders = [];
let loadedTanggal = '';

// URL Apps Script diingat di localStorage supaya tidak perlu tempel ulang
const savedUrl = localStorage.getItem('ls_printstation_url') || '';
if (savedUrl) document.getElementById('scriptUrl').value = savedUrl;

// Default tanggal = hari ini
document.getElementById('tanggal').valueAsDate = new Date();

const BULAN_SINGKAT = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

// Konversi value input date (YYYY-MM-DD) ke format "DD Mon YYYY" ala sheet
function toSheetDate(isoDate) {
  const [y, m, d] = isoDate.split('-');
  return `${d} ${BULAN_SINGKAT[parseInt(m, 10) - 1]} ${y}`;
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

async function loadOrders() {
  const url = document.getElementById('scriptUrl').value.trim();
  const isoDate = document.getElementById('tanggal').value;
  if (!url) return setStatus('Isi dulu URL Apps Script.', 'error');
  if (!isoDate) return setStatus('Pilih tanggal dulu.', 'error');

  localStorage.setItem('ls_printstation_url', url);
  const tanggalSheet = toSheetDate(isoDate);
  setStatus('Menarik data ' + tanggalSheet + '…');
  document.getElementById('btnLoad').disabled = true;

  try {
    // doGet Apps Script bisa dibaca langsung (GET tidak kena masalah CORS
    // seperti POST, karena Apps Script mengizinkan respons JSON untuk GET)
    const res = await fetch(url + '?action=orderTags&tanggal=' + encodeURIComponent(tanggalSheet));
    const data = await res.json();

    if (data.status !== 'ok') throw new Error(data.message || 'Server balas error');

    loadedOrders = data.orders || [];
    loadedTanggal = data.tanggal;

    renderPreview();
    document.getElementById('btnPrint').disabled = loadedOrders.length === 0;
    setStatus(
      loadedOrders.length === 0
        ? 'Tidak ada order di tanggal ' + tanggalSheet + '.'
        : '✓ ' + loadedOrders.length + ' order siap dicetak.',
      loadedOrders.length === 0 ? '' : 'ok'
    );
  } catch (e) {
    setStatus('Gagal menarik data: ' + e.message, 'error');
  } finally {
    document.getElementById('btnLoad').disabled = false;
  }
}

function escapeHtml(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtRp(n) {
  return 'Rp ' + Number(n || 0).toLocaleString('id-ID');
}

function renderPreview() {
  const card = document.getElementById('previewCard');
  const list = document.getElementById('previewList');
  document.getElementById('countBadge').textContent = loadedOrders.length;

  if (loadedOrders.length === 0) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';
  list.innerHTML = loadedOrders.map(o => `
    <div class="tag-preview">
      <div class="tp-customer">${escapeHtml(o.customer)}</div>
      <div class="tp-meta">${escapeHtml(o.kasir || '')} · ${escapeHtml(o.kategori)} · Order ${escapeHtml(o.orderId)}</div>
      ${o.items.map(i => `<div class="tp-item"><span>${escapeHtml(i.produk)}</span><span>×${i.qty}</span></div>`).join('')}
      <div class="tp-total">${o.kategori === 'Paid' ? fmtRp(o.totalOrder) : 'FREE / MARKETING'}</div>
    </div>`).join('');
}

function buildTagHTML(o) {
  return `
    <div class="print-tag">
      <div class="pt-header"><img src="${LOGO_B64}" alt="Little Spoon"></div>
      <div class="pt-customer">${escapeHtml(o.customer)}</div>
      <div class="pt-meta">
        📅 PO: ${escapeHtml(loadedTanggal)}<br>
        ${o.kasir ? 'Kasir: ' + escapeHtml(o.kasir) : ''}
      </div>
      <div class="pt-items">
        ${o.items.map(i => `
          <div class="pt-item">
            <span>${escapeHtml(i.produk)}</span>
            <span>×${i.qty}</span>
          </div>`).join('')}
      </div>
      ${o.kategori === 'Paid'
        ? `<div class="pt-total">TOTAL: ${fmtRp(o.totalOrder)}</div>`
        : `<div class="pt-total">FREE / MARKETING</div>`}
      <div class="pt-footer">
        follow us @LITTLESPOON.BDG<br>
        untuk pemesanan : 0859 7411 7919
      </div>
      <div class="pt-note">Terima kasih! 🤎</div>
    </div>`;
}

function printAll() {
  if (loadedOrders.length === 0) return;
  const area = document.getElementById('printArea');
  area.innerHTML = loadedOrders.map(buildTagHTML).join('');
  // PENTING: tunggu semua logo selesai di-decode dulu baru buka dialog
  // print. Kalau window.print() dipanggil langsung, sebagian browser/
  // print driver mengambil snapshot sebelum gambar termuat → logo kosong.
  const imgs = Array.from(area.querySelectorAll('img'));
  Promise.all(imgs.map(img =>
    (img.complete && img.naturalWidth > 0)
      ? Promise.resolve()
      : new Promise(res => { img.onload = res; img.onerror = res; })
  )).then(() => window.print());
}
</script>
</body>
</html>
