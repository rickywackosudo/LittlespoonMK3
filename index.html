<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS — Little Spoon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FAF6F0;
    --warm-white: #FFFDF9;
    --brown: #3B2A1A;
    --terracotta: #C05E3A;
    --sage: #7A8C6E;
    --gold: #C9973A;
    --border: #E8DDD0;
    --muted: #9B8B7A;
    --paid-bg: #F0F7F0;
    --paid: #4A7A4A;
    --free-bg: #FFF3EE;
    --free: #C05E3A;
  }

  body {
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    color: var(--brown);
    min-height: 100vh;
  }

  header {
    background: var(--brown);
    color: var(--cream);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    letter-spacing: 0.02em;
  }

  header .date-display {
    font-size: 13px;
    color: #C9B9A6;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 0;
    height: calc(100vh - 58px);
  }

  /* LEFT: Product Panel */
  .products-panel {
    overflow-y: auto;
    padding: 20px;
    border-right: 1px solid var(--border);
    background: var(--warm-white);
  }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    margin-top: 20px;
  }

  .section-title:first-child { margin-top: 0; }

  .product-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 8px;
  }

  .product-card {
    background: var(--cream);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }

  .product-card:hover {
    border-color: var(--terracotta);
    background: #FFF8F5;
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(192,94,58,0.1);
  }

  .product-card:active { transform: translateY(0); }

  .product-card .name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 4px;
  }

  .product-card .price {
    font-size: 12px;
    color: var(--terracotta);
    font-weight: 500;
  }

  .product-card .bundle-note {
    font-size: 10px;
    color: var(--sage);
    margin-top: 3px;
  }

  /* RIGHT: Order Panel */
  .order-panel {
    display: flex;
    flex-direction: column;
    background: var(--warm-white);
    overflow: hidden;
  }

  .order-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
  }

  .order-header h2 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .input-row input, .input-row select {
    border: 1.5px solid var(--border);
    background: var(--cream);
    border-radius: 7px;
    padding: 8px 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--brown);
    outline: none;
    transition: border-color 0.15s;
  }

  .input-row input:focus, .input-row select:focus {
    border-color: var(--terracotta);
  }

  .input-row input[name="customer"] { flex: 1; min-width: 120px; }

  .kategori-toggle {
    display: flex;
    gap: 0;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }

  .kategori-toggle button {
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    border: none;
    background: var(--cream);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .kategori-toggle button.active-paid {
    background: var(--paid-bg);
    color: var(--paid);
  }

  .kategori-toggle button.active-free {
    background: var(--free-bg);
    color: var(--free);
  }

  .order-items {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px;
  }

  .order-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .order-item:last-child { border-bottom: none; }

  .order-item .item-name {
    flex: 1;
    font-size: 13px;
    font-weight: 500;
  }

  .order-item .item-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .qty-ctrl {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .qty-ctrl button {
    width: 26px; height: 26px;
    border: 1.5px solid var(--border);
    background: var(--cream);
    border-radius: 6px;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    color: var(--brown);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
  }

  .qty-ctrl button:hover { border-color: var(--terracotta); color: var(--terracotta); }

  .qty-ctrl span {
    font-size: 13px;
    font-weight: 600;
    min-width: 20px;
    text-align: center;
  }

  .item-total {
    font-size: 13px;
    font-weight: 600;
    min-width: 70px;
    text-align: right;
    color: var(--terracotta);
  }

  .btn-remove {
    background: none;
    border: none;
    cursor: pointer;
    color: #CCC;
    font-size: 16px;
    transition: color 0.12s;
    padding: 2px;
  }
  .btn-remove:hover { color: var(--terracotta); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 13px;
  }

  /* Cashier Login Modal */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: rgba(59,42,26,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  .login-card {
    background: var(--warm-white);
    border-radius: 16px;
    padding: 32px;
    width: 320px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(59,42,26,0.25);
  }

  .login-card h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    margin-bottom: 4px;
    color: var(--brown);
  }

  .login-card p {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .login-card input {
    width: 100%;
    border: 1.5px solid var(--border);
    background: var(--cream);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    margin-bottom: 14px;
    text-align: center;
  }

  .login-card input:focus { border-color: var(--terracotta); }

  .login-card button {
    width: 100%;
    padding: 11px;
    background: var(--terracotta);
    color: white;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .login-card button:hover { background: #A84E2E; }

  .cashier-badge {
    font-size: 11px;
    color: #C9B9A6;
    cursor: pointer;
  }

  .cashier-badge:hover { color: var(--gold); }

  .order-footer {
    border-top: 1px solid var(--border);
    padding: 14px 20px;
  }

  .totals {
    margin-bottom: 12px;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 3px 0;
    color: var(--muted);
  }

  .total-row.grand {
    font-size: 16px;
    font-weight: 700;
    color: var(--brown);
    border-top: 1px solid var(--border);
    margin-top: 6px;
    padding-top: 8px;
  }

  .btn-add-order {
    width: 100%;
    padding: 12px;
    background: var(--terracotta);
    color: white;
    border: none;
    border-radius: 9px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-add-order:hover { background: #A84E2E; }
  .btn-add-order:disabled { background: #CCC; cursor: not-allowed; }

  /* Daily Summary */
  .summary-bar {
    background: var(--brown);
    color: var(--cream);
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
  }

  .summary-bar .omzet {
    font-weight: 700;
    font-size: 15px;
    color: var(--gold);
  }

  /* Log Panel (bottom) */
  .log-section {
    background: var(--warm-white);
    border-top: 2px solid var(--border);
    max-height: 260px;
    overflow-y: auto;
    padding: 12px 20px;
  }

  .log-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .log-title button {
    font-size: 11px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 8px;
    cursor: pointer;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    transition: all 0.12s;
  }

  .log-title button:hover { border-color: var(--terracotta); color: var(--terracotta); }

  .log-entry {
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 12px;
  }

  .log-entry .log-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .log-entry .customer-name {
    font-weight: 700;
    font-size: 13px;
  }

  .log-entry .badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
  }

  .badge-paid { background: var(--paid-bg); color: var(--paid); }
  .badge-free { background: var(--free-bg); color: var(--free); }

  .log-entry .log-items { color: var(--muted); line-height: 1.6; }

  .log-entry .log-total {
    font-weight: 700;
    color: var(--terracotta);
    margin-top: 4px;
  }

  .log-entry .btn-delete-log {
    background: none;
    border: none;
    cursor: pointer;
    color: #CCC;
    font-size: 14px;
    float: right;
    transition: color 0.12s;
  }

  .log-entry .btn-delete-log:hover { color: var(--terracotta); }

  .export-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--sage);
    color: white;
    border: none;
    border-radius: 7px;
    padding: 7px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .export-btn:hover { background: #5E6E52; }

  .full-width-log {
    grid-column: 1 / -1;
  }

  /* Notification */
  .notif {
    position: fixed;
    bottom: 20px; right: 20px;
    background: var(--brown);
    color: var(--cream);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.25s;
    pointer-events: none;
    z-index: 999;
  }

  .notif.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 700px) {
    .layout {
      grid-template-columns: 1fr;
      height: auto;
      position: relative;
    }

    .mobile-tabs {
      display: flex;
      background: var(--warm-white);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .mobile-tabs button {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 2.5px solid transparent;
      cursor: pointer;
    }

    .mobile-tabs button.active {
      color: var(--terracotta);
      border-bottom-color: var(--terracotta);
    }

    .mobile-tabs .cart-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      background: var(--terracotta);
      color: white;
      border-radius: 10px;
      font-size: 10px;
      margin-left: 4px;
    }

    .products-panel {
      border-right: none;
      max-height: none;
      display: none;
    }
    .products-panel.mobile-active { display: block; }

    .order-panel {
      display: none;
    }
    .order-panel.mobile-active { display: flex; }

    header {
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 16px;
    }

    header h1 { font-size: 17px; }
  }

  @media (min-width: 701px) {
    .mobile-tabs { display: none; }
  }
/* ── PRINT ORDER TAG (thermal 58mm) ─────────────────────────── */
#printArea { display: none; }

@media print {
  /* Sembunyikan seluruh aplikasi, tampilkan hanya area tag */
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block !important; }

  @page {
    size: 58mm auto;   /* lebar kertas thermal; panjang mengikuti isi */
    margin: 0;
  }

  .print-tag {
    width: 48mm;              /* area cetak efektif kertas 58mm */
    padding: 2mm 1mm 6mm 1mm;
    font-family: 'Courier New', monospace; /* font monospace tajam di thermal */
    font-size: 11px;
    color: #000;
    page-break-after: always; /* tiap tag = 1 potong kertas */
  }
  .print-tag:last-child { page-break-after: auto; }

  .print-tag .pt-header {
    text-align: center;
    font-weight: bold;
    font-size: 12px;
    border-bottom: 1px dashed #000;
    padding-bottom: 2mm;
    margin-bottom: 2mm;
  }
  .print-tag .pt-customer {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 1mm;
    word-wrap: break-word;
  }
  .print-tag .pt-meta {
    font-size: 10px;
    margin-bottom: 2mm;
  }
  .print-tag .pt-items {
    border-top: 1px dashed #000;
    border-bottom: 1px dashed #000;
    padding: 1.5mm 0;
    margin-bottom: 1.5mm;
  }
  .print-tag .pt-item { display: flex; justify-content: space-between; }
  .print-tag .pt-total { font-weight: bold; text-align: right; }
  .print-tag .pt-note { font-size: 9px; text-align: center; margin-top: 1mm; }
}
</style>
</head>
<body>

<header>
  <h1>🥐 Little Spoon</h1>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;">
    <span class="cashier-badge" id="cashierBadge" onclick="switchCashier()"></span>
    <button onclick="setupScriptUrl()" id="syncStatus" style="background:none;border:none;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;color:#C9B9A6;">⚙️ Sheets</button>
  </div>
</header>
<div id="dateBar" style="background:var(--cream);border-bottom:1px solid var(--border);padding:6px 16px;font-size:11px;color:var(--muted);text-align:right;" >
  <span id="headerDate"></span>
</div>

<div style="display:flex; flex-direction:column; height:calc(100vh - 58px);">
  <div class="mobile-tabs">
    <button id="tabProducts" class="active" onclick="switchMobileTab('products')">🥐 Produk</button>
    <button id="tabOrder" onclick="switchMobileTab('order')">🧾 Order <span class="cart-count" id="cartCount" style="display:none;">0</span></button>
  </div>
  <div class="layout" style="flex:1; min-height:0;">

    <!-- PRODUCTS -->
    <div class="products-panel mobile-active" id="productsPanel">
      <p class="section-title">🥐 Menu</p>
      <div class="product-grid" id="grid-menu"></div>

      <p class="section-title">🤝 B2B</p>
      <div class="product-grid" id="grid-b2b"></div>

      <p class="section-title">📦 Packaging</p>
      <div class="product-grid" id="grid-packaging"></div>
    </div>

    <!-- ORDER -->
    <div class="order-panel" id="orderPanel">
      <div class="order-header">
        <h2 id="orderHeaderTitle">Order Baru</h2>
        <div class="input-row">
          <input name="customer" id="customerInput" type="text" placeholder="Nama customer…" />
          <div class="kategori-toggle">
            <button id="btnPaid" class="active-paid" onclick="setKategori('Paid')">Paid</button>
            <button id="btnFree" onclick="setKategori('Free')">Free</button>
          </div>
        </div>
        <div class="input-row" style="margin-top:8px;">
          <label style="font-size:11px;color:var(--muted);white-space:nowrap;">📅 Tgl Pesanan:</label>
          <input type="date" id="orderDateInput" style="flex:1;" />
        </div>
      </div>

      <div class="order-items" id="orderItems">
        <div class="empty-state">Pilih produk dari panel kiri</div>
      </div>

      <div class="order-footer">
        <div class="totals" id="totals"></div>
        <button class="btn-add-order" id="btnAddOrder" onclick="addOrder()">+ Tambah ke Laporan</button>
        <button id="btnCancelEdit" onclick="cancelEdit()" style="display:none;width:100%;margin-top:8px;padding:9px;background:none;border:1.5px solid var(--border);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--muted);cursor:pointer;">✕ Batal Edit</button>
      </div>
    </div>
  </div>

  <!-- LOG -->
  <div class="log-section full-width-log">
    <div class="log-title">
      <span>📋 Laporan Hari Ini</span>
      <div style="display:flex;gap:8px;align-items:center;">
        <span id="omzetDisplay" style="color:var(--terracotta);font-weight:700;font-size:13px;"></span>
        <button onclick="verifySyncStatus(false)" title="Verifikasi status upload ke server">🔄 Cek Status</button>
        <button onclick="printAllTags()">🖨 Cetak Semua Tag</button>
        <button onclick="refreshHPP()" title="Muat ulang HPP live dari Inventory">⟳ HPP</button>
        <button onclick="exportCSV()">⬇ Export CSV</button>
        <button onclick="clearAll()" style="color:#C05E3A;">🗑 Hapus Semua</button>
      </div>
    </div>
    <div id="logEntries"></div>
  </div>
</div>

<div class="notif" id="notif"></div>

<!-- Area khusus print: terisi saat tombol 🖨 ditekan, hanya tampil saat print -->
<div id="printArea"></div>

<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>🥐 Little Spoon</h2>
    <p>Masukkan nama kasir untuk mulai</p>
    <input type="text" id="cashierInput" placeholder="Nama kasir…" onkeydown="if(event.key==='Enter')loginCashier()" />
    <button onclick="loginCashier()">Mulai Kerja</button>
  </div>
</div>

<script>
// ─── SAFE STORAGE (fallback jika localStorage diblokir, mis. Safari file://) ───
const safeStorage = {
  _memory: {},
  getItem(key) {
    try {
      return localStorage.getItem(key);
    } catch (e) {
      return this._memory[key] || null;
    }
  },
  setItem(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch (e) {
      this._memory[key] = value;
    }
  }
};

// Terapkan kumpulan HPP (dari server atau cache) ke PRODUCTS di memori
function applyHPPValues(hppMap) {
  if (!hppMap) return 0;
  // index nama BOM (lowercase) → nilai, biar kebal beda kapitalisasi
  const idx = {};
  Object.entries(hppMap).forEach(([k, v]) => { idx[String(k).toLowerCase().trim()] = v; });
  let updated = 0;
  ['menu', 'b2b'].forEach(cat => {
    PRODUCTS[cat].forEach(p => {
      if (p.isPackaging) return;
      const bomName = BOM_NAME[p.id];
      if (!bomName) return;
      const val = idx[bomName.toLowerCase()];
      if (typeof val === 'number' && val > 0) {
        const baru = Math.round(val);
        if (baru !== p.hpp) { p.hpp = baru; updated++; }
      }
    });
  });
  return updated;
}

function applyHPPCache() {
  try {
    const cache = JSON.parse(safeStorage.getItem('ls_hpp_cache') || 'null');
    if (cache && cache.hpp) {
      const n = applyHPPValues(cache.hpp);
      if (n > 0) console.log(`HPP cache diterapkan (${n} produk, per ${new Date(cache.t).toLocaleString('id-ID')})`);
    }
  } catch (e) { /* cache korup → abaikan, pakai fallback hardcode */ }
}

async function loadHPPLive(tampilkanNotif) {
  if (!INVENTORY_URL) return;
  try {
    const res = await fetch(INVENTORY_URL + '?action=hppProduk');
    const data = await res.json();
    if (data && data.status === 'ok' && data.hpp) {
      const n = applyHPPValues(data.hpp);
      safeStorage.setItem('ls_hpp_cache', JSON.stringify({ t: Date.now(), hpp: data.hpp }));
      if (n > 0) showNotif(`✓ HPP live dimuat — ${n} produk diperbarui`);
      else if (tampilkanNotif) showNotif('✓ HPP live dimuat — semua sudah terbaru');
      if (data.bahanTanpaHarga && data.bahanTanpaHarga.length > 0) {
        console.warn('⚠️ Bahan tanpa harga di Master Bahan:', data.bahanTanpaHarga.join(', '));
      }
    }
  } catch (e) {
    console.warn('Gagal memuat HPP live (pakai cache/fallback):', e);
    if (tampilkanNotif) showNotif('⚠️ Gagal memuat HPP live — pakai nilai tersimpan');
  }
}

const fmt = n => 'Rp ' + n.toLocaleString('id-ID');

function getProduct(id) {
  return [...PRODUCTS.menu, ...PRODUCTS.b2b, ...PRODUCTS.packaging].find(p => p.id === id);
}

function calcItemPrice(id, qty) {
  const p = getProduct(id);
  if (!p) return 0;
  if (p.tiers) {
    // Multi-tier per-pcs (mis. Mousse Tiramisu): tiers sudah diurutkan
    // dari qty tertinggi ke terendah — pakai tier pertama yang qty-nya cukup
    const tier = p.tiers.find(t => qty >= t.qty);
    return tier ? qty * tier.price : qty * p.basePrice;
  }
  if (p.bundle) {
    // Mousse Tiramisu lama / produk perPcs tunggal (kalau masih dipakai)
    if (p.bundle.perPcs) {
      return qty >= p.bundle.qty
        ? qty * p.bundle.price
        : qty * p.basePrice;
    }
    // Dubai Chewi: bundling per-paket
    const bundles = Math.floor(qty / p.bundle.qty);
    const sisa = qty % p.bundle.qty;
    return bundles * p.bundle.price + sisa * p.basePrice;
  }
  return qty * p.basePrice;
}

function totalCart() {
  return Object.entries(cart).reduce((sum, [id, qty]) => sum + calcItemPrice(id, qty), 0);
}

function totalOmzet() {
  return orders
    .filter(o => o.kategori === 'Paid')
    .reduce((s, o) => s + o.total, 0);
}

// Total tagihan customer (termasuk bubble wrap)
// Total omzet (exclude bubble wrap & free)
function calcOrderTotal(cartObj, kat) {
  if (kat !== 'Paid') return 0;
  return Object.entries(cartObj).reduce((sum, [id, qty]) => {
    const p = getProduct(id);
    if (!p || p.isPackaging) return sum; // bubble wrap tidak masuk omzet
    return sum + calcItemPrice(id, qty);
  }, 0);
}

function removeFromCart(id) {

function renderCart() {
  const container = document.getElementById('orderItems');
  const ids = Object.keys(cart);

  if (ids.length === 0) {
    container.innerHTML = '<div class="empty-state">Pilih produk dari panel kiri</div>';
    document.getElementById('totals').innerHTML = '';
    document.getElementById('btnAddOrder').disabled = true;
    updateCartCountBadge();
    return;
  }

  document.getElementById('btnAddOrder').disabled = false;
  container.innerHTML = ids.map(id => {
    const p = getProduct(id);
    const qty = cart[id];
    const total = calcItemPrice(id, qty);
    const unitDesc = p.tiers
      ? (() => {
          // Multi-tier per-pcs: tampilkan tier yang sedang aktif untuk qty ini
          const tier = p.tiers.find(t => qty >= t.qty);
          return tier
            ? `${qty} pcs × ${fmt(tier.price)} (harga bundling ${tier.qty}+ pcs)`
            : `${qty} pcs × ${fmt(p.basePrice)}`;
        })()
      : p.bundle
      ? (() => {
          if (p.bundle.perPcs) {
            // Produk perPcs tunggal (legacy, kalau masih ada yg pakai)
            return qty >= p.bundle.qty
              ? `${qty} pcs × ${fmt(p.bundle.price)} (harga bundling)`
              : `${qty} pcs × ${fmt(p.basePrice)}`;
          }
          // Dubai Chewi: bundling per-paket
          const b = Math.floor(qty / p.bundle.qty), s = qty % p.bundle.qty;
          let parts = [];
          if (b) parts.push(`${b}×bundle`);
          if (s) parts.push(`${s}×satuan`);
          return parts.join(' + ');
        })()
      : '';
    return `
      <div class="order-item">
        <div style="flex:1">
          <div class="item-name">${p.name}</div>
          ${unitDesc ? `<div class="item-sub">${unitDesc}</div>` : ''}
        </div>
        <div class="qty-ctrl">
          <button onclick="setQty('${id}',-1)">−</button>
          <span>${qty}</span>
          <button onclick="setQty('${id}',1)">+</button>
        </div>
        <div class="item-total">${fmt(total)}</div>
        <button class="btn-remove" onclick="removeFromCart('${id}')">✕</button>
      </div>
    `;
  }).join('');

  const grand = totalCart();
  document.getElementById('totals').innerHTML = `
    <div class="total-row grand">
      <span>Total</span>
      <span>${fmt(grand)}</span>
    </div>
  `;
  updateCartCountBadge();
}

// Parse orderDate tersimpan ('07 Jul 2026' atau '12/7/2026') → 'YYYY-MM-DD'
function parseOrderDateToISO(str) {
  if (!str) return '';
  const s = String(str).trim();
  const BULAN = { jan:1, feb:2, mar:3, apr:4, mei:5, jun:6, jul:7, agu:8, sep:9, okt:10, nov:11, des:12 };
  let m = s.match(/^(\d{1,2})\s+([A-Za-z]{3})\w*\s+(\d{4})$/); // '07 Jul 2026'
  if (m) {
    const mm = BULAN[m[2].toLowerCase().slice(0,3)];
    if (mm) return `${m[3]}-${String(mm).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); // '12/7/2026' (D/M/YYYY id-ID)
  if (m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return '';
}

// Transaction ID unik: timestamp + random suffix, supaya tidak bentrok
// meski dua order dibuat di milidetik yang sama (mis. tap cepat di device beda)
function generateTransactionId() {
  const rand = Math.random().toString(36).slice(2, 8);
  return `TXN-${Date.now()}-${rand}`;
}

// Konversi YYYY-MM-DD (dari <input type=date>) ke format DD/M/YYYY ala id-ID
function formatDateID(isoDate) {
  const [y, m, d] = isoDate.split('-');
  // Gunakan format "DD Mon YYYY" (misal "07 Jul 2026") supaya
  // Google Sheets tidak salah baca sebagai format Amerika (M/D/YYYY)
  const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const mIdx = parseInt(m) - 1;
  return `${d} ${bulan[mIdx]} ${y}`;
}

// ─── SYNC KE GOOGLE SHEETS ─────────────────────────────────────
// ─── ANTRIAN SYNC (untuk retry otomatis jika gagal/offline) ────
let syncQueue = JSON.parse(safeStorage.getItem('ls_sync_queue') || '[]');
let isSyncing = false;

// ── AUTO-CLEANUP SEKALI JALAN ──
// Versi sebelumnya sempat kena bug: fetch tanpa no-cors gagal baca respons
// (CORS block dari redirect Apps Script), bikin order dianggap gagal terus
// padahal server sudah sukses proses — order itu numpuk di antrian retry
// selamanya ("zombie"), dan bisa insert ulang tiap retry kalau baris aslinya
// sempat dihapus manual di Sheets. Kode ini jalan OTOMATIS sekali saat kasir
// buka HTML versi baru ini (tidak perlu apa-apa dari kasir, tidak perlu buka
// Console) — bersihkan sisa antrian lama yang berpotensi zombie itu.
// Aman: proteksi anti-duplikat utama tetap ada di server (cek Order ID),
// jadi order yang genuinely belum tersimpan pun tidak akan hilang percuma —
// paling buruk perlu di-input ulang manual kalau memang belum ke-input,
// tapi cek dulu ke Sheets sebelum re-input supaya tidak dobel.
const SYNC_QUEUE_FIX_VERSION = 'nocors-fix-2026-07-08';
if (safeStorage.getItem('ls_sync_queue_fix_version') !== SYNC_QUEUE_FIX_VERSION) {
  if (syncQueue.length > 0) {
    console.warn(`Membersihkan ${syncQueue.length} antrian sync lama (kemungkinan zombie dari bug sebelumnya).`);
  }
  syncQueue = [];
  safeStorage.setItem('ls_sync_queue', JSON.stringify(syncQueue));
  safeStorage.setItem('ls_sync_queue_fix_version', SYNC_QUEUE_FIX_VERSION);
}

// ── RECONCILIATION STATUS PENDING/UPLOADED ──
// Order lama (dibuat sebelum fitur status Pending/Uploaded ada) tidak
// punya field syncStatus sama sekali → badge default tampil "Pending"
// walau order itu sebenarnya sudah lama tersimpan di Sheets. Kalau order
// tidak punya syncStatus TAPI juga tidak ada di antrian retry saat ini,
// berarti dulu sudah terkirim sukses (fire-and-forget no-cors) — aman
// dianggap Uploaded. Jalan otomatis tiap kali halaman dibuka.
function reconcileSyncStatus() {
  const queuedOrderIds = new Set(
    syncQueue.map(j => String((j.rows && j.rows[0] && j.rows[0].orderId) || j.orderId || ''))
  );
  let adaPerubahan = false;
  orders.forEach(o => {
    if (!o.syncStatus && !queuedOrderIds.has(String(o.id))) {
      o.syncStatus = 'uploaded';
      adaPerubahan = true;
    }
  });
  if (adaPerubahan) saveOrders();
}
reconcileSyncStatus();

function saveSyncQueue() {
  safeStorage.setItem('ls_sync_queue', JSON.stringify(syncQueue));
}

function queuePush(payload) {
  syncQueue.push({ ...payload, _addedAt: Date.now(), _attempts: 0 });
  saveSyncQueue();
  updateSyncStatus();
}

async function processSyncQueue() {
  const url = APPS_SCRIPT_URL;
  if (!url || isSyncing || syncQueue.length === 0) return;
  if (!navigator.onLine) return; // jangan coba kalau jelas-jelas offline

  isSyncing = true;
  while (syncQueue.length > 0) {
    const job = syncQueue[0];
    try {
      await fetch(url, {
        method: 'POST',
        mode: 'no-cors', // lihat catatan di syncOrderToSheets soal kenapa no-cors
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(job)
      });
      // Anggap sukses (optimistic) — proteksi anti-duplikat sebenarnya
      // ada di server via cek Order ID, bukan di kemampuan baca respons ini.
      markOrderUploaded(job);
      syncQueue.shift();
      saveSyncQueue();
    } catch (e) {
      job._attempts = (job._attempts || 0) + 1;
      saveSyncQueue();
      console.warn('Sync gagal, akan dicoba lagi:', e);
      break; // berhenti, coba lagi nanti (jangan spam retry beruntun)
    }
  }
  isSyncing = false;
  updateSyncStatus();
}

// Tandai order (di localStorage) sebagai sudah ter-upload, berdasarkan
// orderId yang ada di payload job yang baru sukses disync
function markOrderUploaded(job) {
  const orderId = job.rows && job.rows[0] ? job.rows[0].orderId : job.orderId;
  if (!orderId) return;
  const o = orders.find(x => String(x.id) === String(orderId));
  if (o) {
    o.syncStatus = 'uploaded';
    saveOrders();
    renderLog();
  }
}

// Coba proses antrian tiap kali koneksi kembali online
window.addEventListener('online', () => {
  showNotif('🌐 Koneksi kembali — menyinkronkan data tertunda…');
  processSyncQueue();
});

// Coba proses antrian tiap 15 detik (jaga-jaga event 'online' tidak terpicu)
setInterval(processSyncQueue, 15000);

// ─── SYNC KE GOOGLE SHEETS ─────────────────────────────────────
async function syncOrderToSheets(order) {
  const url = APPS_SCRIPT_URL;
  if (!url) return; // Belum dikonfigurasi, skip

  const rows = order.items.map(item => ({
    tanggal: order.orderDate,
    waktu: order.timestamp,
    customer: order.customer,
    produk: item.name,
    qty: item.qty,
    // Harga satuan dihitung dari total aktual / qty — akurat walau kena
    // harga tier/bundling (bukan selalu basePrice normal)
    hargaSatuan: item.qty > 0 ? Math.round(item.total / item.qty) : 0,
    hpp: getProduct(item.id)?.hpp || 0,
    total: item.total,
    kategori: order.kategori,
    totalOrder: order.total,
    kasir: order.cashier,
    orderId: order.id
  }));

  const payload = { action: 'add', rows };

  try {
    if (!navigator.onLine) throw new Error('offline');
    // PENTING: kembali pakai no-cors. Apps Script Web App redirect ke domain
    // googleusercontent.com yang tidak kirim header CORS yang bisa dibaca browser
    // — kalau kita coba baca respons (fetch biasa), browser SELALU anggap gagal
    // walau server-nya sukses proses, bikin order masuk retry queue selamanya
    // dan bisa "insert ulang" tiap kali di-retry. Proteksi anti-duplikat
    // sekarang murni diserahkan ke server (cek Order ID sebelum insert),
    // bukan ke kemampuan client baca respons.
    await fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    // no-cors tidak kasih tahu sukses/gagal HTTP secara pasti, tapi kalau fetch
    // tidak throw berarti request terkirim — anggap sukses (optimistic).
    // Proteksi sebenarnya ada di server (Order ID sudah pernah masuk = skip).
    order.syncStatus = 'uploaded';
    saveOrders();
    renderLog();
    showNotif(`✓ Order tersimpan & tersync ke Sheets`);
  } catch (e) {
    console.warn('Sync gagal, dimasukkan ke antrian retry:', e);
    queuePush(payload);
    showNotif(`⚠️ Order tersimpan lokal — akan disync otomatis saat online`);
  }
}

// ─── HAPUS ORDER DARI SHEETS ────────────────────────────────────
async function deleteOrderFromSheets(orderId) {
  const url = APPS_SCRIPT_URL;
  if (!url) return;
  const payload = { action: 'delete', orderId };
  try {
    if (!navigator.onLine) throw new Error('offline');
    await fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
  } catch (e) {
    console.warn('Hapus di Sheets gagal, dimasukkan ke antrian retry:', e);
    queuePush(payload);
  }
}

// ─── SETUP SCRIPT URL ──────────────────────────────────────────
function setupScriptUrl() {
  const url = prompt('Paste URL Google Apps Script kamu:', APPS_SCRIPT_URL);
  if (url && url.startsWith('https://')) {
    APPS_SCRIPT_URL = url;
    safeStorage.setItem('ls_script_url', url);
    showNotif('✓ URL tersimpan!');
    updateSyncStatus();
  }
}

function updateSyncStatus() {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const pending = syncQueue.length;
  if (!APPS_SCRIPT_URL) {
    el.textContent = '⚙️ Sheets';
    el.style.color = 'var(--muted)';
  } else if (pending > 0) {
    el.textContent = `🟡 ${pending} tertunda`;
    el.style.color = 'var(--gold)';
  } else {
    el.textContent = '🟢 Sheets';
    el.style.color = 'var(--sage)';
  }
}

// ─── LOG ───────────────────────────────────────────────────────
function deleteOrder(id) {
  if (!confirm('Hapus order ini? Data di Google Sheets juga akan ikut terhapus.')) return;
  if (editingOrderId && String(editingOrderId) === String(id)) {
    cart = {};
    resetEditUI();
    renderCart();
  }
  orders = orders.filter(o => String(o.id) !== String(id));
  saveOrders();
  renderLog();
  deleteOrderFromSheets(id);
  showNotif('✓ Order dihapus & Sheets diperbarui');
}

function renderLog() {
  const container = document.getElementById('logEntries');
  if (orders.length === 0) {
    container.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:10px 0;">Belum ada order hari ini.</div>';
    document.getElementById('omzetDisplay').textContent = '';
    return;
  }

  container.innerHTML = [...orders].reverse().map(o => {
    const today = new Date().toLocaleDateString('id-ID');
    const isPreOrder = o.orderDate && o.orderDate !== today;
    return `
    <div class="log-entry">
      <div class="log-head">
        <div>
          <span class="customer-name">${o.customer}</span>
          <span style="font-size:11px;color:var(--muted);margin-left:8px;">${o.timestamp}</span>
          ${o.cashier ? `<span style="font-size:10px;color:var(--sage);margin-left:6px;">· ${o.cashier}</span>` : ''}
          ${isPreOrder ? `<span style="font-size:10px;color:var(--gold);margin-left:6px;background:#FFF8EC;padding:1px 6px;border-radius:8px;">📅 PO ${o.orderDate}</span>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="badge ${o.kategori === 'Paid' ? 'badge-paid' : 'badge-free'}">${o.kategori}</span>
          <span style="font-size:10px;padding:1px 6px;border-radius:8px;${o.syncStatus === 'uploaded' ? 'color:var(--sage);background:#EFF7EF;' : 'color:var(--gold);background:#FFF8EC;'}">${o.syncStatus === 'uploaded' ? '🟢 Uploaded' : '🟡 Pending'}</span>
          <button class="btn-delete-log" onclick="editOrder('${o.id}')" title="Edit order" style="color:var(--sage);">✎</button>
          <button class="btn-delete-log" onclick="printOrderTag('${o.id}')" title="Cetak order tag" style="color:var(--sage);">🖨</button>
          <button class="btn-delete-log" onclick="deleteOrder('${o.id}')">✕</button>
        </div>
      </div>
      <div class="log-items">
        ${o.items.map(i => `${i.name} ×${i.qty} → ${fmt(i.total)}`).join('<br>')}
      </div>
      ${o.kategori === 'Paid' ? `<div class="log-total">${fmt(o.total)}</div>` : '<div style="font-size:11px;color:var(--muted);margin-top:4px;">Gratis / Marketing</div>'}
    </div>
  `;
  }).join('');

  const omzet = totalOmzet();
  const paidCount = orders.filter(o => o.kategori === 'Paid').length;
  const freeCount = orders.filter(o => o.kategori !== 'Paid').length;
  document.getElementById('omzetDisplay').textContent =
    `Omzet: ${fmt(omzet)} | Paid: ${paidCount} | Gratis: ${freeCount}`;
}

// ─── VERIFIKASI STATUS KE SERVER (sumber kebenaran: Sheets) ────
// Tanya server Order ID mana saja yang SUDAH ada di Sheets, lalu:
// 1. Update badge Pending → Uploaded sesuai kenyataan server (bukan tebakan)
// 2. Buang job antrian retry yang order-nya ternyata sudah tersimpan
//    → ini yang mematikan "zombie" secara permanen di device manapun
// GET ke Apps Script bisa dibaca responnya (beda dengan POST), jadi ini
// konfirmasi sungguhan, bukan optimistic guess.
let isVerifying = false;
async function verifySyncStatus(silent) {
  const url = APPS_SCRIPT_URL;
  if (!url || isVerifying || !navigator.onLine) return;

  // Kumpulkan semua Order ID yang perlu dicek: order lokal + isi antrian
  const localIds = orders.map(o => String(o.id));
  const queueIds = syncQueue
    .map(j => String((j.rows && j.rows[0] && j.rows[0].orderId) || j.orderId || ''))
    .filter(Boolean);
  const allIds = [...new Set([...localIds, ...queueIds])];
  if (allIds.length === 0) return;

  isVerifying = true;
  try {
    const res = await fetch(url + '?action=checkOrders&ids=' + encodeURIComponent(allIds.join(',')));
    const data = await res.json();
    if (data.status !== 'ok' || !data.exists) throw new Error(data.message || 'respons tidak dikenal');

    let statusUpdated = 0;
    let zombiesKilled = 0;

    // 1. Sinkronkan badge dengan kenyataan server
    orders.forEach(o => {
      const ada = data.exists[String(o.id)];
      if (ada && o.syncStatus !== 'uploaded') {
        o.syncStatus = 'uploaded';
        statusUpdated++;
      } else if (ada === false && o.syncStatus === 'uploaded') {
        // Server bilang TIDAK ada padahal lokal bilang uploaded →
        // kembalikan ke pending supaya dikirim ulang (dedup server aman)
        o.syncStatus = 'pending';
        queuePush({ action: 'add', rows: buildRowsPayload(o) });
        statusUpdated++;
      }
    });
    if (statusUpdated > 0) { saveOrders(); renderLog(); }

    // 2. Bunuh zombie: buang job 'add' yang order-nya sudah ada di server
    const before = syncQueue.length;
    syncQueue = syncQueue.filter(j => {
      if ((j.action || 'add') !== 'add') return true; // job delete dibiarkan
      const jid = String((j.rows && j.rows[0] && j.rows[0].orderId) || '');
      return !(jid && data.exists[jid] === true);
    });
    zombiesKilled = before - syncQueue.length;
    if (zombiesKilled > 0) saveSyncQueue();

    if (!silent) {
      showNotif(`✓ Verifikasi server: ${statusUpdated} status diperbarui, ${zombiesKilled} antrian usang dibuang`);
    }
  } catch (e) {
    if (!silent) showNotif('⚠️ Gagal verifikasi ke server: ' + e.message);
    console.warn('verifySyncStatus gagal:', e);
  } finally {
    isVerifying = false;
    updateSyncStatus();
  }
}

// Payload rows untuk kirim ulang order (dipakai verifySyncStatus)
function buildRowsPayload(order) {
  return order.items.map(item => ({
    tanggal: order.orderDate,
    waktu: order.timestamp,
    customer: order.customer,
    produk: item.name,
    qty: item.qty,
    hargaSatuan: item.qty > 0 ? Math.round(item.total / item.qty) : 0,
    hpp: getProduct(item.id)?.hpp || 0,
    total: item.total,
    kategori: order.kategori,
    totalOrder: order.total,
    kasir: order.cashier,
    orderId: order.id
  }));
}

// Verifikasi otomatis: saat halaman dibuka + tiap 2 menit
setTimeout(() => verifySyncStatus(true), 4000);
setInterval(() => verifySyncStatus(true), 120000);

// ─── PRINT ORDER TAG (thermal 58mm via Bluetooth) ──────────────
// Membangun tag per customer lalu memanggil dialog print browser.
// Android meneruskan ke printer Bluetooth ber-print-service; iPhone via
// AirPrint (printer thermal umumnya tidak support — pakai Save as PDF,
// atau gunakan Print Station terpusat untuk cetak semua dari 1 device).
function buildTagHTML(o) {
  const isPO = o.orderDate && o.orderDate !== new Date().toLocaleDateString('id-ID');
  return `
    <div class="print-tag">
      <div class="pt-header">🥄 LITTLE SPOON</div>
      <div class="pt-customer">${escapeHtml(o.customer)}</div>
      <div class="pt-meta">
        ${isPO ? '📅 PO: ' + escapeHtml(o.orderDate) : escapeHtml(o.orderDate || '')}<br>
        Input: ${escapeHtml(o.timestamp || '')}${o.cashier ? ' · ' + escapeHtml(o.cashier) : ''}
      </div>
      <div class="pt-items">
        ${o.items.map(i => `
          <div class="pt-item">
            <span>${escapeHtml(i.name)}</span>
            <span>×${i.qty}</span>
          </div>`).join('')}
      </div>
      ${o.kategori === 'Paid'
        ? `<div class="pt-total">TOTAL: ${fmt(o.total)}</div>`
        : `<div class="pt-total">FREE / MARKETING</div>`}
      <div class="pt-note">Terima kasih! 🤎</div>
    </div>`;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function printOrderTag(id) {
  const o = orders.find(x => String(x.id) === String(id));
  if (!o) return showNotif('Order tidak ditemukan');
  document.getElementById('printArea').innerHTML = buildTagHTML(o);
  window.print();
}

function printAllTags() {
  if (orders.length === 0) return showNotif('Belum ada order');
  // Urut sesuai urutan input (terlama dulu) supaya urutan kertas = urutan packing
  document.getElementById('printArea').innerHTML = orders.map(buildTagHTML).join('');
  window.print();
}

// ─── EXPORT CSV ────────────────────────────────────────────────
function exportCSV() {
  if (orders.length === 0) return showNotif('Belum ada data');
  const today = new Date().toLocaleDateString('id-ID');
  const rows = [['Tanggal', 'Nama Customer', 'Produk', 'Qty', 'Harga Satuan', 'Total', 'Kategori']];

  orders.forEach(o => {
    o.items.forEach(item => {
      const p = getProduct(item.id);
      rows.push([
        today, o.customer, item.name, item.qty,
        p.basePrice, item.total, o.kategori
      ]);
    });
  });

  const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `laporan-${today.replace(/\//g,'-')}.csv`;
  a.click();
  showNotif('CSV berhasil didownload');
}

async function clearAll() {
  // Verifikasi dulu ke server supaya peringatan berbasis kenyataan Sheets,
  // bukan status lokal yang mungkin basi (mis. Safari suspend sebelum
  // sempat menandai uploaded) — mencegah peringatan "belum terupload" palsu
  showNotif('Memverifikasi status ke server dulu…');
  await verifySyncStatus(true);

  const pending = orders.filter(o => o.syncStatus === 'pending');

  if (pending.length > 0) {
    const namaPending = pending.map(o => `• ${o.customer} (${fmt(o.total)})`).join('\n');
    const lanjut = confirm(
      `⚠️ PERINGATAN: ${pending.length} order BELUM ter-upload ke Sheets (sudah diverifikasi langsung ke server):\n\n${namaPending}\n\n` +
      `Kalau dilanjutkan, order ini akan HILANG PERMANEN (tidak pernah tersimpan di Sheets sama sekali).\n\n` +
      `Disarankan: tunggu sampai status sync selesai dulu, atau cek koneksi internet.\n\n` +
      `Tetap hapus semua sekarang?`
    );
    if (!lanjut) return;
  } else {
    if (!confirm('Hapus tampilan log order di perangkat ini?\n\nSemua order sudah terverifikasi tersimpan di Google Sheets — ini hanya membersihkan tampilan lokal, bukan menghapus data.')) return;
  }

  orders = [];
  saveOrders();
  renderLog();
  showNotif('✓ Tampilan lokal dibersihkan — data di Sheets tetap ada');
}

  new Date().toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
